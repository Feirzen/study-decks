<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f0f13">
<title>Study Decks</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #0f0f13; color: #f0f0f5;
    font-family: Georgia, 'Times New Roman', serif;
    min-height: 100vh; -webkit-font-smoothing: antialiased;
  }
  #app { min-height: 100vh; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 40px 20px; }
  button { font-family: inherit; }
  .muted { color: #666; }
  .eyebrow { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: #666; }
  h1 { font-size: 32px; font-weight: bold; line-height: 1.15; margin: 6px 0 0; }
  .card {
    background: #1a1a24; border: 1.5px solid #2a2a38; border-radius: 14px;
    padding: 18px 22px; cursor: pointer; text-align: left; color: #f0f0f5;
    width: 100%; display: block; transition: border-color .15s, transform .1s;
    position: relative; overflow: hidden;
  }
  .card:active { transform: scale(.99); }
  .card .fill { position: absolute; top: 0; left: 0; height: 100%; transition: width .5s; }
  .card .row { position: relative; display: flex; justify-content: space-between; align-items: center; }
  .stats { background: #1a1a24; border: 1px solid #2a2a38; border-radius: 12px; padding: 14px 20px; display: flex; gap: 24px; }
  .stat { text-align: center; flex: 1; }
  .stat .n { font-size: 24px; font-weight: bold; }
  .stat .l { font-size: 11px; color: #666; margin-top: 2px; }
  .backbtn { background: none; border: none; color: #aaa; cursor: pointer; padding: 0; font-size: 22px; line-height: 1; }
  .grid-q { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 10px; }
  .qcell { aspect-ratio: 1; border-radius: 10px; border: 2px solid #2a2a38; background: #1a1a24;
    color: #888; font-weight: bold; font-size: 15px; cursor: pointer; position: relative;
    display: flex; align-items: center; justify-content: center; }
  .qcell .st { position: absolute; top: 3px; right: 5px; font-size: 10px; color: #F59E0B; }
  .opt { background: #1a1a24; border: 1.5px solid #2a2a38; border-radius: 12px; padding: 14px 16px;
    cursor: pointer; color: #e0e0e8; text-align: left; font-size: 15px; line-height: 1.45;
    display: flex; align-items: center; gap: 12px; width: 100%; transition: all .12s; }
  .opt .box { width: 22px; height: 22px; min-width: 22px; border: 1.5px solid #444;
    display: flex; align-items: center; justify-content: center; transition: all .12s; }
  .opt .box.mc { border-radius: 50%; }
  .opt .box.multi { border-radius: 5px; }
  .opt .box .dot { width: 8px; height: 8px; background: #fff; }
  .opt .box.mc .dot { border-radius: 50%; }
  .primary { width: 100%; border: none; border-radius: 12px; padding: 15px; cursor: pointer;
    color: #fff; font-weight: bold; font-size: 16px; }
  .ghost { background: #1a1a24; border: 1px solid #2a2a38; border-radius: 12px; padding: 15px;
    cursor: pointer; color: #ccc; font-weight: bold; font-size: 15px; flex: 1;
    display: flex; align-items: center; justify-content: center; gap: 8px; }
  .fb { border-radius: 12px; padding: 16px 18px; display: flex; gap: 12px; align-items: flex-start; }
  .star { background: none; border: none; cursor: pointer; padding: 2px; font-size: 20px; line-height: 1; }
  .progressbar { height: 3px; background: #1e1e28; border-radius: 2px; overflow: hidden; }
  .progressbar > div { height: 100%; border-radius: 2px; transition: width .3s; }
  .pill { border-radius: 10px; height: 40px; padding: 0 16px; border: none; cursor: pointer;
    font-weight: bold; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; }
  /* Flashcard */
  .flashscene { perspective: 1200px; }
  .flashcard { position: relative; width: 100%; min-height: 320px; cursor: pointer;
    transform-style: preserve-3d; transition: transform .5s; }
  .flashcard.flipped { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: 18px; padding: 32px; display: flex; flex-direction: column; justify-content: center;
    border: 1px solid #2a2a38; background: #1a1a24; }
  .face.back { transform: rotateY(180deg); background: #16161e; }
  .face .lbl { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 14px; }
  .face .txt { font-size: 21px; line-height: 1.5; }
  .face .sub { font-size: 15px; line-height: 1.6; color: #bbb; margin-top: 14px; }
  .empty { text-align: center; color: #777; padding: 60px 20px; }
  a { color: #7cc; }
  @keyframes pulse { 0%{opacity:0} 20%{opacity:1} 70%{opacity:.6} 100%{opacity:0} }
  .glow { position: fixed; inset: 0; pointer-events: none; z-index: 9999; }
</style>
</head>
<body>
<div id="app"></div>
<script>
// =================== CONFIG ===================
const MANIFEST_URL = "sets/manifest.json";

// =================== STATE ===================
const S = {
  screen: "home",           // home | classView | setHome | quiz | flash | shuffle
  manifest: null,
  classId: null,
  set: null,                // loaded set object
  cat: null,                // category name (quiz)
  qi: 0,                    // question index within category
  selected: [], feedback: null, showAnswer: false,
  flashList: [], flashIdx: 0, flipped: false,
  shuffleQ: [], shuffleIdx: 0, streak: 0, high: 0, hadBreak: false,
};
let progress = null;        // persisted object for current set
const orders = {};          // transient shuffled option orders by question id

// =================== PERSISTENCE ===================
function loadProgress(setId) {
  try {
    const raw = localStorage.getItem("fc:" + setId);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { results: {}, starred: {}, known: {}, high: 0 };
}
function saveProgress() {
  if (!S.set) return;
  try { localStorage.setItem("fc:" + S.set.id, JSON.stringify(progress)); } catch (e) {}
}

// =================== UTIL ===================
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function allQuestions(set) { return set.categories.flatMap(c => c.questions.map(q => ({ ...q, _cat: c }))); }
function optionOrder(q) {
  if (!orders[q.id]) orders[q.id] = shuffle(q.options.map((_, i) => i));
  return orders[q.id];
}
function freshOrder(q) { orders[q.id] = shuffle(q.options.map((_, i) => i)); }
function correctText(q) {
  if (q.type === "mc") return q.options[q.answer];
  return q.answers.map(i => q.options[i]).join("  •  ");
}

// =================== ICONS (inline svg) ===================
const I = {
  chevL: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>',
  check: c => `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`,
  x: c => `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`,
  starOn: '★', starOff: '☆',
};

// =================== BOOT ===================
async function boot() {
  try {
    const res = await fetch(MANIFEST_URL, { cache: "no-cache" });
    if (!res.ok) throw new Error("manifest " + res.status);
    S.manifest = await res.json();
  } catch (e) {
    document.getElementById("app").innerHTML =
      '<div class="wrap"><div class="empty">Couldn\'t load <code>sets/manifest.json</code>.<br><br>' +
      'If you just opened the file directly, use a local server or GitHub Pages —<br>browsers block fetch() on file:// URLs.<br><br>' +
      '<span class="muted">' + esc(e.message) + '</span></div></div>';
    return;
  }
  render();
}

async function openSet(cls, setMeta) {
  const res = await fetch(setMeta.file, { cache: "no-cache" });
  const set = await res.json();
  set.id = set.id || setMeta.id;
  S.set = set;
  progress = loadProgress(set.id);
  S.high = progress.high || 0;
  S.screen = "setHome";
  render();
}

// =================== RENDER ROUTER ===================
function render() {
  const el = document.getElementById("app");
  let html = "";
  if (S.screen === "home") html = viewHome();
  else if (S.screen === "classView") html = viewClass();
  else if (S.screen === "setHome") html = viewSetHome();
  else if (S.screen === "quiz") html = viewQuiz();
  else if (S.screen === "flash") html = viewFlash();
  else if (S.screen === "shuffle") html = viewShuffle();
  el.innerHTML = html;
  window.scrollTo(0, 0);
}

// =================== HOME (classes) ===================
function viewHome() {
  const classes = S.manifest.classes || [];
  let cards = classes.map(c => {
    const n = (c.sets || []).length;
    return `<button class="card" data-act="openClass" data-id="${esc(c.id)}" style="margin-bottom:12px">
      <div class="row">
        <div>
          <div class="eyebrow" style="color:${c.color || "#7C3AED"}">${n} set${n === 1 ? "" : "s"}</div>
          <div style="font-size:18px;font-weight:bold;margin-top:3px">${esc(c.name)}</div>
        </div>
        <div style="font-size:22px;color:${c.color || "#7C3AED"}">›</div>
      </div>
    </button>`;
  }).join("");
  if (!classes.length) cards = '<div class="empty">No classes yet. Add one in <code>sets/manifest.json</code>.</div>';
  return `<div class="wrap">
    <div style="margin-bottom:28px">
      <div class="eyebrow">Study Decks</div>
      <h1>Your Classes</h1>
    </div>
    ${cards}
  </div>`;
}

// =================== CLASS (sets) ===================
function viewClass() {
  const c = S.manifest.classes.find(x => x.id === S.classId);
  const sets = (c.sets || []).map(s => {
    const p = loadProgress(s.id);
    const answered = Object.keys(p.results || {}).length;
    return `<button class="card" data-act="openSet" data-id="${esc(s.id)}" style="margin-bottom:12px">
      <div class="row">
        <div>
          <div class="eyebrow" style="color:${c.color || "#0EA5E9"}">${answered ? answered + " answered" : "Not started"}</div>
          <div style="font-size:18px;font-weight:bold;margin-top:3px">${esc(s.title)}</div>
          ${s.subtitle ? `<div class="muted" style="font-size:13px;margin-top:2px">${esc(s.subtitle)}</div>` : ""}
        </div>
        <div style="font-size:22px;color:${c.color || "#0EA5E9"}">›</div>
      </div>
    </button>`;
  }).join("") || '<div class="empty">No sets in this class yet.</div>';
  return `<div class="wrap">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:28px">
      <button class="backbtn" data-act="home">${I.chevL}</button>
      <div><div class="eyebrow" style="color:${c.color || "#0EA5E9"}">Class</div>
      <div style="font-size:22px;font-weight:bold">${esc(c.name)}</div></div>
    </div>
    ${sets}
  </div>`;
}

// =================== SET HOME (modes + categories) ===================
function viewSetHome() {
  const set = S.set;
  const qs = allQuestions(set);
  const total = qs.length;
  const correct = qs.filter(q => progress.results[q.id] === "correct").length;
  const incorrect = qs.filter(q => progress.results[q.id] === "incorrect").length;
  const unanswered = total - correct - incorrect;
  const starredN = qs.filter(q => progress.starred[q.id]).length;

  const catCards = set.categories.map(c => {
    const cc = c.questions.filter(q => progress.results[q.id] === "correct").length;
    const pct = Math.round((cc / c.questions.length) * 100) || 0;
    const done = cc === c.questions.length;
    return `<button class="card" data-act="openCat" data-cat="${esc(c.category)}" style="border-color:${done ? "#22d3a0" : "#2a2a38"};margin-bottom:10px">
      <div class="fill" style="width:${pct}%;background:${c.color}14"></div>
      <div class="row">
        <div>
          <div class="eyebrow" style="color:${c.color}">${done ? "✓ Complete" : cc + "/" + c.questions.length + " correct"}</div>
          <div style="font-size:16px;font-weight:bold;margin-top:2px">${esc(c.category)}</div>
        </div>
        <div style="font-size:19px;color:${c.color};font-weight:bold">${pct}%</div>
      </div>
    </button>`;
  }).join("");

  return `<div class="wrap">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:22px">
      <button class="backbtn" data-act="backToClass">${I.chevL}</button>
      <div><div class="eyebrow" style="color:#0EA5E9">${esc(set.class)} · ${esc(set.title)}</div>
      <div style="font-size:22px;font-weight:bold">${esc(set.subtitle || set.title)}</div></div>
    </div>

    <div class="stats" style="margin-bottom:18px">
      <div class="stat"><div class="n" style="color:#22d3a0">${correct}</div><div class="l">Correct</div></div>
      <div class="stat"><div class="n" style="color:#f87171">${incorrect}</div><div class="l">Incorrect</div></div>
      <div class="stat"><div class="n" style="color:#555">${unanswered}</div><div class="l">Unanswered</div></div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
      <button class="pill" data-act="startFlash" data-scope="all" style="background:#1a1a24;border:1.5px solid #2a2a38;color:#f0f0f5;justify-content:center;height:52px">🃏 Flashcards</button>
      <button class="pill" data-act="startShuffle" data-scope="all" style="background:linear-gradient(135deg,#f97316,#dc2626);color:#fff8e0;justify-content:center;height:52px">⚡ Shuffle</button>
    </div>
    ${starredN ? `<button class="pill" data-act="startFlash" data-scope="starred" style="background:#2a1f00;border:1.5px solid #F59E0B;color:#F59E0B;justify-content:center;height:44px;width:100%;margin-bottom:20px">★ Review ${starredN} starred as flashcards</button>` : `<div style="margin-bottom:20px"></div>`}

    <div class="eyebrow" style="margin-bottom:10px">Quiz by category</div>
    ${catCards}
  </div>`;
}

// =================== QUIZ ===================
function currentCat() { return S.set.categories.find(c => c.category === S.cat); }
function viewQuiz() {
  const c = currentCat();
  const q = c.questions[S.qi];
  const order = optionOrder(q);
  const starred = !!progress.starred[q.id];
  const opts = order.map((origIdx, pos) => {
    const isSel = S.selected.includes(pos);
    const isCorrect = q.type === "mc" ? q.answer === origIdx : (q.answers || []).includes(origIdx);
    const reveal = S.feedback === "correct" || (S.feedback === "incorrect" && S.showAnswer);
    let border = "#2a2a38", bg = "#1a1a24";
    if (reveal && isCorrect) { border = "#22d3a0"; bg = "#22d3a015"; }
    if (isSel && !S.feedback) { border = c.color; bg = c.color + "18"; }
    if (S.feedback === "incorrect" && isSel && !isCorrect) { border = "#f87171"; bg = "#f8717115"; }
    return `<button class="opt" data-act="pick" data-pos="${pos}" style="border-color:${border};background:${bg}">
      <span class="box ${q.type}" style="border-color:${isSel ? c.color : "#444"};background:${isSel ? c.color : "transparent"}">${isSel ? '<span class="dot"></span>' : ""}</span>
      <span>${esc(q.options[origIdx])}</span>
    </button>`;
  }).join("");

  let fb = "";
  if (S.feedback) {
    const ok = S.feedback === "correct";
    const showExp = S.showAnswer || ok;
    fb = `<div class="fb" style="background:${ok ? "#22d3a015" : "#f8717115"};border:1px solid ${ok ? "#22d3a0" : "#f87171"};margin-bottom:18px">
      ${ok ? I.check("#22d3a0") : I.x("#f87171")}
      <div><div style="font-weight:bold;color:${ok ? "#22d3a0" : "#f87171"};margin-bottom:4px">${ok ? "Correct!" : "Incorrect"}</div>
      ${showExp ? `<div style="color:#ccc;font-size:14px;line-height:1.6">${esc(q.explanation || "")}</div>` : ""}</div>
    </div>`;
  }

  let buttons;
  if (!S.feedback) {
    buttons = `<button class="primary" data-act="submitQuiz" style="background:${S.selected.length ? c.color : "#2a2a38"}" ${S.selected.length ? "" : "disabled"}>Submit Answer</button>`;
  } else if (S.feedback === "incorrect") {
    buttons = `${!S.showAnswer ? `<button class="ghost" data-act="showAns">👁 Show Answer</button>` : ""}
      <button class="ghost" data-act="retry" style="border-color:#f87171;color:#f87171">↻ Retry</button>
      <button class="primary" data-act="nextQuiz" style="background:${c.color};flex:1">${S.qi < c.questions.length - 1 ? "Next →" : "Finish"}</button>`;
  } else {
    buttons = `<button class="primary" data-act="nextQuiz" style="background:${c.color}">${S.qi < c.questions.length - 1 ? "Next →" : "Finish"}</button>`;
  }

  return `<div class="wrap">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="backbtn" data-act="toCatGrid">${I.chevL}</button>
        <span class="eyebrow" style="color:${c.color}">${esc(c.category)}</span>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <button class="star" data-act="star" data-id="${q.id}" style="color:${starred ? "#F59E0B" : "#444"}">${starred ? I.starOn : I.starOff}</button>
        <span class="muted" style="font-size:13px">${S.qi + 1}/${c.questions.length}</span>
      </div>
    </div>
    <div class="progressbar" style="margin-bottom:22px"><div style="width:${((S.qi + 1) / c.questions.length) * 100}%;background:${c.color}"></div></div>
    <div class="card" style="cursor:default;margin-bottom:18px">
      <div class="eyebrow" style="color:${c.color};margin-bottom:10px">${q.type === "mc" ? "Multiple Choice" : "Select All That Apply"}</div>
      <div style="font-size:18px;line-height:1.55">${esc(q.question)}</div>
    </div>
    <div style="display:grid;gap:10px;margin-bottom:18px">${opts}</div>
    ${fb}
    <div style="display:flex;gap:10px">${buttons}</div>
  </div>`;
}

function viewCatGrid() { /* rendered inline via setHome cat click -> we use a dedicated grid screen */ }

// Category grid (question map)
function viewQuizGrid() {
  const c = currentCat();
  const done = c.questions.every(q => progress.results[q.id] === "correct");
  const cells = c.questions.map((q, idx) => {
    const st = progress.results[q.id] || "unanswered";
    const col = st === "correct" ? "#22d3a0" : st === "incorrect" ? "#f87171" : "#888";
    const bg = st === "correct" ? "#22d3a020" : st === "incorrect" ? "#f8717120" : "#1a1a24";
    const bd = st === "correct" ? "#22d3a0" : st === "incorrect" ? "#f87171" : "#2a2a38";
    return `<button class="qcell" data-act="goQ" data-idx="${idx}" style="color:${col};background:${bg};border-color:${bd}">${idx + 1}${progress.starred[q.id] ? '<span class="st">★</span>' : ""}</button>`;
  }).join("");
  return `<div class="wrap">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px">
      <button class="backbtn" data-act="backToSet">${I.chevL}</button>
      <div><div class="eyebrow" style="color:${c.color}">${esc(c.category)}</div>
      <div style="font-size:20px;font-weight:bold">Question Grid</div></div>
    </div>
    ${done ? `<div class="fb" style="background:#22d3a015;border:1px solid #22d3a0;justify-content:center;margin-bottom:20px;color:#22d3a0;font-weight:bold">🏆 All correct in this category!</div>` : ""}
    <div class="grid-q" style="margin-bottom:26px">${cells}</div>
    <button class="primary" data-act="goQ" data-idx="0" style="background:${c.color}">Start / Continue →</button>
  </div>`;
}

// =================== FLASHCARDS ===================
function buildFlashList(scope) {
  let qs = allQuestions(S.set);
  if (scope === "starred") qs = qs.filter(q => progress.starred[q.id]);
  // include explicit flashcards if a category defines them
  const explicit = S.set.categories.flatMap(c => (c.flashcards || []).map(f => ({ ...f, _cat: c, _explicit: true })));
  return shuffle(qs.concat(explicit));
}
function viewFlash() {
  if (!S.flashList.length) {
    return `<div class="wrap"><div style="display:flex;align-items:center;gap:12px;margin-bottom:24px"><button class="backbtn" data-act="backToSet">${I.chevL}</button><div style="font-size:20px;font-weight:bold">Flashcards</div></div><div class="empty">Nothing to review here yet.</div></div>`;
  }
  const item = S.flashList[S.flashIdx];
  const c = item._cat || { color: "#0EA5E9", category: "" };
  const front = item._explicit ? item.front : item.question;
  const back = item._explicit ? item.back : correctText(item);
  const backSub = item._explicit ? "" : (item.explanation || "");
  const known = progress.known[item.id];
  const starred = !!progress.starred[item.id];
  return `<div class="wrap">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <button class="backbtn" data-act="backToSet">${I.chevL}</button>
      <span class="eyebrow" style="color:${c.color}">${esc(c.category || "Flashcards")}</span>
      <div style="display:flex;align-items:center;gap:12px">
        <button class="star" data-act="star" data-id="${item.id}" data-stay="flash" style="color:${starred ? "#F59E0B" : "#555"}">${starred ? I.starOn : I.starOff}</button>
        <span class="muted" style="font-size:13px">${S.flashIdx + 1}/${S.flashList.length}</span>
      </div>
    </div>
    <div class="flashscene" style="margin-bottom:20px">
      <div class="flashcard ${S.flipped ? "flipped" : ""}" data-act="flip">
        <div class="face front">
          <div class="lbl" style="color:${c.color}">Question · tap to flip</div>
          <div class="txt">${esc(front)}</div>
        </div>
        <div class="face back">
          <div class="lbl" style="color:#22d3a0">Answer</div>
          <div class="txt">${esc(back)}</div>
          ${backSub ? `<div class="sub">${esc(backSub)}</div>` : ""}
        </div>
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-bottom:12px">
      <button class="ghost" data-act="mark" data-known="unknown" style="border-color:${known === "unknown" ? "#f87171" : "#2a2a38"};color:${known === "unknown" ? "#f87171" : "#ccc"}">Still learning</button>
      <button class="ghost" data-act="mark" data-known="known" style="border-color:${known === "known" ? "#22d3a0" : "#2a2a38"};color:${known === "known" ? "#22d3a0" : "#ccc"}">Got it ✓</button>
    </div>
    <div style="display:flex;gap:10px">
      <button class="ghost" data-act="flashPrev" ${S.flashIdx === 0 ? "disabled" : ""}>← Prev</button>
      <button class="primary" data-act="flashNext" style="background:${c.color};flex:1">${S.flashIdx < S.flashList.length - 1 ? "Next →" : "Restart ↻"}</button>
    </div>
  </div>`;
}

// =================== SHUFFLE ===================
function viewShuffle() {
  const q = S.shuffleQ[S.shuffleIdx];
  if (!q) return `<div class="wrap"><div class="empty">No questions to shuffle.</div></div>`;
  const c = q._cat || { color: "#f97316" };
  const order = optionOrder(q);
  const starred = !!progress.starred[q.id];
  const opts = order.map((origIdx, pos) => {
    const isSel = S.selected.includes(pos);
    const isCorrect = q.type === "mc" ? q.answer === origIdx : (q.answers || []).includes(origIdx);
    let border = "#2a2a38", bg = "#161620";
    if (S.feedback && isCorrect) { border = "#f97316"; bg = "#f9731618"; }
    if (isSel && !S.feedback) { border = "#f97316"; bg = "#f9731618"; }
    if (S.feedback === "incorrect" && isSel && !isCorrect) { border = "#666"; bg = "#1a1a1a"; }
    return `<button class="opt" data-act="pick" data-pos="${pos}" style="border-color:${border};background:${bg}">
      <span class="box ${q.type}" style="border-color:${isSel ? "#f97316" : "#444"};background:${isSel ? "#f97316" : "transparent"}">${isSel ? '<span class="dot"></span>' : ""}</span>
      <span>${esc(q.options[origIdx])}</span>
    </button>`;
  }).join("");
  let fb = "";
  if (S.feedback) {
    const ok = S.feedback === "correct";
    fb = `<div class="fb" style="background:${ok ? "#f9731615" : "#1a1a1a"};border:1px solid ${ok ? "#f97316" : "#444"};margin-bottom:18px">
      ${ok ? I.check("#f97316") : I.x("#888")}
      <div><div style="font-weight:bold;color:${ok ? "#f97316" : "#f87171"};margin-bottom:4px">${ok ? "Correct! 🔥 " + S.streak : "Streak ended" + (S.high ? " — best: " + S.high : "")}</div>
      <div style="color:#e0c0a0;font-size:14px;line-height:1.6">${esc(q.explanation || "")}</div></div>
    </div>`;
  }
  const btn = !S.feedback
    ? `<button class="primary" data-act="submitShuffle" style="background:${S.selected.length ? "linear-gradient(135deg,#f97316,#ef4444)" : "#2a2a38"}" ${S.selected.length ? "" : "disabled"}>Submit Answer</button>`
    : `<button class="primary" data-act="nextShuffle" style="background:linear-gradient(135deg,#f97316,#ef4444)">Next →</button>`;
  return `<div class="wrap">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
      <button class="backbtn" data-act="backToSet">${I.chevL} </button>
      <span class="eyebrow" style="color:#f97316">Shuffle</span>
      <div style="display:flex;gap:16px;align-items:center">
        <div style="text-align:center"><div style="font-size:10px;color:#f9a86b;text-transform:uppercase;letter-spacing:1px">Streak</div><div style="font-size:20px;font-weight:bold;color:${S.streak ? "#f97316" : "#555"}">${S.streak}</div></div>
        ${S.high ? `<div style="text-align:center"><div style="font-size:10px;color:#888;text-transform:uppercase;letter-spacing:1px">Best</div><div style="font-size:20px;font-weight:bold;color:#f59e0b">${S.high}</div></div>` : ""}
      </div>
    </div>
    <div style="display:flex;justify-content:flex-end;margin-bottom:10px">
      <button class="star" data-act="star" data-id="${q.id}" data-stay="shuffle" style="color:${starred ? "#F59E0B" : "#555"}">${starred ? I.starOn : I.starOff}</button>
    </div>
    <div class="card" style="cursor:default;margin-bottom:18px">
      <div class="eyebrow" style="color:#f97316;margin-bottom:10px">${q.type === "mc" ? "Multiple Choice" : "Select All That Apply"}</div>
      <div style="font-size:18px;line-height:1.55">${esc(q.question)}</div>
    </div>
    <div style="display:grid;gap:10px;margin-bottom:18px">${opts}</div>
    ${fb}
    <div>${btn}</div>
  </div>`;
}

// =================== GRADING ===================
function grade(q, sel) {
  const order = optionOrder(q);
  if (q.type === "mc") {
    return sel.length === 1 && order[sel[0]] === q.answer;
  }
  const chosen = sel.map(i => order[i]).sort().join(",");
  const ans = (q.answers || []).slice().sort().join(",");
  return chosen === ans;
}

// =================== EVENTS ===================
document.addEventListener("click", (ev) => {
  const t = ev.target.closest("[data-act]");
  if (!t) return;
  const act = t.dataset.act;

  // navigation
  if (act === "home") { S.screen = "home"; return render(); }
  if (act === "openClass") { S.classId = t.dataset.id; S.screen = "classView"; return render(); }
  if (act === "backToClass") { S.screen = "classView"; return render(); }
  if (act === "openSet") {
    const c = S.manifest.classes.find(x => x.id === S.classId);
    const meta = c.sets.find(s => s.id === t.dataset.id);
    return openSet(c, meta);
  }
  if (act === "backToSet") { S.screen = "setHome"; return render(); }

  // quiz nav
  if (act === "openCat") { S.cat = t.dataset.cat; S._grid = true; renderGrid(); return; }
  if (act === "toCatGrid") { renderGrid(); return; }
  if (act === "goQ") { S.qi = +t.dataset.idx; resetQ(); freshOrder(currentCat().questions[S.qi]); S.screen = "quiz"; return render(); }
  if (act === "pick") return pick(+t.dataset.pos);
  if (act === "submitQuiz") return submitQuiz();
  if (act === "showAns") { S.showAnswer = true; return render(); }
  if (act === "retry") { resetQ(); return render(); }
  if (act === "nextQuiz") return nextQuiz();

  // flashcards
  if (act === "startFlash") { S.flashList = buildFlashList(t.dataset.scope); S.flashIdx = 0; S.flipped = false; S.screen = "flash"; return render(); }
  if (act === "flip") { S.flipped = !S.flipped; return render(); }
  if (act === "mark") { progress.known[S.flashList[S.flashIdx].id] = t.dataset.known; saveProgress(); return render(); }
  if (act === "flashPrev") { if (S.flashIdx > 0) { S.flashIdx--; S.flipped = false; } return render(); }
  if (act === "flashNext") { if (S.flashIdx < S.flashList.length - 1) S.flashIdx++; else S.flashIdx = 0; S.flipped = false; return render(); }

  // shuffle
  if (act === "startShuffle") { S.shuffleQ = buildFlashList(t.dataset.scope).filter(x => !x._explicit); S.shuffleIdx = 0; S.streak = 0; resetQ(); if (S.shuffleQ[0]) freshOrder(S.shuffleQ[0]); S.screen = "shuffle"; return render(); }
  if (act === "submitShuffle") return submitShuffle();
  if (act === "nextShuffle") return nextShuffle();

  // star (works on any screen)
  if (act === "star") {
    const id = t.dataset.id;
    progress.starred[id] = !progress.starred[id];
    saveProgress();
    return render();
  }
});

function renderGrid() {
  document.getElementById("app").innerHTML = viewQuizGrid();
  window.scrollTo(0, 0);
}
function resetQ() { S.selected = []; S.feedback = null; S.showAnswer = false; }
function pick(pos) {
  if (S.feedback) return;
  const q = S.screen === "shuffle" ? S.shuffleQ[S.shuffleIdx] : currentCat().questions[S.qi];
  if (q.type === "mc") S.selected = [pos];
  else S.selected = S.selected.includes(pos) ? S.selected.filter(i => i !== pos) : S.selected.concat(pos);
  render();
}
function submitQuiz() {
  const q = currentCat().questions[S.qi];
  const ok = grade(q, S.selected);
  if (progress.results[q.id] !== "correct") progress.results[q.id] = ok ? "correct" : "incorrect";
  saveProgress();
  S.feedback = ok ? "correct" : "incorrect";
  render();
}
function nextQuiz() {
  const c = currentCat();
  if (S.qi < c.questions.length - 1) { S.qi++; resetQ(); freshOrder(c.questions[S.qi]); render(); }
  else { renderGrid(); }
}
function submitShuffle() {
  const q = S.shuffleQ[S.shuffleIdx];
  const ok = grade(q, S.selected);
  S.streak = ok ? S.streak + 1 : 0;
  if (!ok) S.hadBreak = true;
  S.high = Math.max(S.high, S.streak);
  progress.high = S.high;
  if (progress.results[q.id] !== "correct") progress.results[q.id] = ok ? "correct" : "incorrect";
  saveProgress();
  S.feedback = ok ? "correct" : "incorrect";
  if (!ok) S.showAnswer = true;
  render();
  if (ok) flashGlow("#f9731650"); else flashGlow("#00000088", 700);
}
function nextShuffle() {
  S.shuffleIdx++;
  if (S.shuffleIdx >= S.shuffleQ.length) { S.shuffleQ = shuffle(S.shuffleQ); S.shuffleIdx = 0; }
  resetQ();
  freshOrder(S.shuffleQ[S.shuffleIdx]);
  render();
}
function flashGlow(color, ms) {
  const g = document.createElement("div");
  g.className = "glow";
  g.style.boxShadow = "inset 0 0 70px 18px " + color;
  g.style.animation = "pulse " + ((ms || 1200) / 1000) + "s ease-out forwards";
  document.body.appendChild(g);
  setTimeout(() => g.remove(), ms || 1200);
}

boot();
</script>
