<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 750" width="1160" height="750" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="ah1f2430" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="ahc2410c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ah1d4ed8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ah7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah15803d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ahb91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="ahb45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="ahbe185d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker><marker id="ah0369a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker><marker id="ah334155" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect width="1160" height="750" fill="#ffffff"/><text x="580.0" y="38" text-anchor="middle" font-size="26" font-weight="800" fill="#1f2430">The liver's fed vs fasting switch</text><text x="580.0" y="64" text-anchor="middle" font-size="15" fill="#6b7280">Same enzymes, opposite settings, so opposing pathways never run full speed together</text><rect x="40" y="90" width="530" height="560" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><rect x="590" y="90" width="530" height="560" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="305" y="128" font-size="18" font-weight="800" fill="#0f766e" text-anchor="middle">FED  ·  insulin  ·  DEphosphorylate (PP1)</text><text x="855" y="128" font-size="17" font-weight="800" fill="#c2410c" text-anchor="middle">FASTING  ·  glucagon → cAMP → PKA  ·  phosphorylate</text><rect x="60" y="154" width="490" height="54" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.3"/><text x="78" y="176" font-size="15" font-weight="800" fill="#1f2430" text-anchor="start">PFK-2 ON → ↑F2,6BP</text><text x="78" y="197" font-size="13" font-weight="600" fill="#6b7280" text-anchor="start">PFK-1 ON, FBPase-1 OFF</text><rect x="610" y="154" width="490" height="54" rx="10" fill="#fff" stroke="#c2410c" stroke-width="1.3"/><text x="628" y="176" font-size="15" font-weight="800" fill="#1f2430" text-anchor="start">FBPase-2 ON → ↓F2,6BP</text><text x="628" y="197" font-size="13" font-weight="600" fill="#6b7280" text-anchor="start">PFK-1 slows, FBPase-1 ON</text><rect x="60" y="220" width="490" height="54" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.3"/><text x="78" y="242" font-size="15" font-weight="800" fill="#1f2430" text-anchor="start">Liver pyruvate kinase ON</text><text x="78" y="263" font-size="13" font-weight="600" fill="#6b7280" text-anchor="start">PEP → pyruvate</text><rect x="610" y="220" width="490" height="54" rx="10" fill="#fff" stroke="#c2410c" stroke-width="1.3"/><text x="628" y="242" font-size="15" font-weight="800" fill="#1f2430" text-anchor="start">Liver pyruvate kinase OFF</text><text x="628" y="263" font-size="13" font-weight="600" fill="#6b7280" text-anchor="start">PEP goes to glucose</text><rect x="60" y="286" width="490" height="54" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.3"/><text x="78" y="308" font-size="15" font-weight="800" fill="#1f2430" text-anchor="start">Glucokinase freed from GKRP</text><text x="78" y="329" font-size="13" font-weight="600" fill="#6b7280" text-anchor="start">grabs extra glucose</text><rect x="610" y="286" width="490" height="54" rx="10" fill="#fff" stroke="#c2410c" stroke-width="1.3"/><text x="628" y="308" font-size="15" font-weight="800" fill="#1f2430" text-anchor="start">Glucokinase held in nucleus</text><text x="628" y="329" font-size="13" font-weight="600" fill="#6b7280" text-anchor="start">by regulatory protein</text><rect x="60" y="352" width="490" height="54" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.3"/><text x="78" y="374" font-size="15" font-weight="800" fill="#1f2430" text-anchor="start">Glycogen synthase ON</text><text x="78" y="395" font-size="13" font-weight="600" fill="#6b7280" text-anchor="start">(GSK3 off, G6P activates)</text><rect x="610" y="352" width="490" height="54" rx="10" fill="#fff" stroke="#c2410c" stroke-width="1.3"/><text x="628" y="374" font-size="15" font-weight="800" fill="#1f2430" text-anchor="start">Glycogen synthase OFF</text><text x="628" y="395" font-size="13" font-weight="600" fill="#6b7280" text-anchor="start"></text><rect x="60" y="418" width="490" height="54" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.3"/><text x="78" y="440" font-size="15" font-weight="800" fill="#1f2430" text-anchor="start">Glycogen phosphorylase OFF</text><text x="78" y="461" font-size="13" font-weight="600" fill="#6b7280" text-anchor="start">(glucose helps PP1 shut it)</text><rect x="610" y="418" width="490" height="54" rx="10" fill="#fff" stroke="#c2410c" stroke-width="1.3"/><text x="628" y="440" font-size="15" font-weight="800" fill="#1f2430" text-anchor="start">Glycogen phosphorylase ON</text><text x="628" y="461" font-size="13" font-weight="600" fill="#6b7280" text-anchor="start">(phosphorylase kinase → a form)</text><rect x="60" y="484" width="490" height="54" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.3"/><text x="78" y="506" font-size="15" font-weight="800" fill="#1f2430" text-anchor="start">ACC ON (+ citrate)</text><text x="78" y="527" font-size="13" font-weight="600" fill="#6b7280" text-anchor="start">malonyl-CoA → make fat, block CPT1</text><rect x="610" y="484" width="490" height="54" rx="10" fill="#fff" stroke="#c2410c" stroke-width="1.3"/><text x="628" y="506" font-size="15" font-weight="800" fill="#1f2430" text-anchor="start">ACC OFF (PKA, AMPK)</text><text x="628" y="527" font-size="13" font-weight="600" fill="#6b7280" text-anchor="start">↓malonyl-CoA → β-oxidation runs</text><rect x="60" y="550" width="490" height="54" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.3"/><text x="78" y="572" font-size="15" font-weight="800" fill="#1f2430" text-anchor="start">↑ transcription: HK, PK, ACC, FAS</text><text x="78" y="593" font-size="13" font-weight="600" fill="#6b7280" text-anchor="start">citrate lyase, malic enzyme</text><rect x="610" y="550" width="490" height="54" rx="10" fill="#fff" stroke="#c2410c" stroke-width="1.3"/><text x="628" y="572" font-size="15" font-weight="800" fill="#1f2430" text-anchor="start">Acetyl-CoA ↑ from β-ox</text><text x="628" y="593" font-size="13" font-weight="600" fill="#6b7280" text-anchor="start">PC ON, PDH OFF → make glucose</text><rect x="40" y="670" width="1080" height="60" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="580" y="708" font-size="16" font-weight="800" fill="#7c3aed" text-anchor="middle">Rule of thumb in the liver: phosphorylated = "make and release glucose" (some enzymes turn on, some off)</text></svg>