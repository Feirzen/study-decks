stroke-width="2"/><text x="928" y="314" font-size="17" font-weight="600" fill="#1f2430" text-anchor="middle">H</text><text x="1054" y="314" font-size="17" font-weight="600" fill="#b91c1c" text-anchor="middle">OH</text><text x="895" y="314" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">4</text><line x1="990" y1="160" x2="990" y2="348" stroke="#1f2430" stroke-width="2"/><text x="990" y="368" font-size="18" font-weight="600" fill="#1f2430" text-anchor="middle">CH₂OH</text><text x="895" y="368" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">5</text><text x="345" y="470" font-size="15" font-weight="700" fill="#be185d" text-anchor="middle">C4 epimer of glucose</text><text x="560" y="470" font-size="15" font-weight="700" fill="#15803d" text-anchor="middle">C2 epimer of glucose</text><text x="775" y="470" font-size="15" font-weight="700" fill="#b45309" text-anchor="middle">ketose: C═O on C2</text><text x="990" y="420" font-size="15" font-weight="700" fill="#7c3aed" text-anchor="middle">aldopentose (5 C)</text><rect x="40" y="500" width="1060" height="120" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/><text x="70" y="535" font-size="16" font-weight="700" fill="#1f2430" text-anchor="start">Memory hook (OH side, C2 → C5):  glucose  R L R R   ·   galactose  R L L R   ·   mannose  L L R R</text><text x="70" y="565" font-size="15" font-weight="500" fill="#1f2430" text-anchor="start">Penultimate carbon (last chiral C) OH on the RIGHT = D-sugar.  Epimers differ at exactly ONE chiral carbon.</text><text x="70" y="593" font-size="15" font-weight="500" fill="#b91c1c" text-anchor="start">Galactose vs mannose differ at C2 AND C4, so they're diastereomers, not epimers.</text></svg>