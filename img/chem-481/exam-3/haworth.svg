<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" width="1160" height="560" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="ah1f2430" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="ahc2410c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ah1d4ed8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ah7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah15803d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ahb91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="ahb45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="ahbe185d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker><marker id="ah0369a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker><marker id="ah334155" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect width="1160" height="560" fill="#ffffff"/><text x="580.0" y="38" text-anchor="middle" font-size="26" font-weight="800" fill="#1f2430">Fischer → Haworth in one picture</text><text x="580.0" y="64" text-anchor="middle" font-size="15" fill="#6b7280">Changing only the anomeric carbon gives a different ANOMER, not a different sugar</text><text x="150" y="110" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">D-Glucose (open)</text><text x="150" y="152" font-size="18" font-weight="600" fill="#1f2430" text-anchor="middle">CHO</text><text x="55" y="152" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">1</text><line x1="102" y1="200" x2="198" y2="200" stroke="#1f2430" stroke-width="2"/><text x="88" y="206" font-size="17" font-weight="600" fill="#1f2430" text-anchor="middle">H</text><text x="214" y="206" font-size="17" font-weight="600" fill="#b91c1c" text-anchor="middle">OH</text><text x="55" y="206" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">2</text><line x1="102" y1="254" x2="198" y2="254" stroke="#1f2430" stroke-width="2"/><text x="88" y="260" font-size="17" font-weight="600" fill="#b91c1c" text-anchor="middle">HO</text><text x="214" y="260" font-size="17" font-weight="600" fill="#1f2430" text-anchor="middle">H</text><text x="55" y="260" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">3</text><line x1="102" y1="308" x2="198" y2="308" stroke="#1f2430" stroke-width="2"/><text x="88" y="314" font-size="17" font-weight="600" fill="#1f2430" text-anchor="middle">H</text><text x="214" y="314" font-size="17" font-weight="600" fill="#b91c1c" text-anchor="middle">OH</text><text x="55" y="314" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">4</text><line x1="102" y1="362" x2="198" y2="362" stroke="#1f2430" stroke-width="2"/><text x="88" y="368" font-size="17" font-weight="600" fill="#1f2430" text-anchor="middle">H</text><text x="214" y="368" font-size="17" font-weight="600" fill="#b91c1c" text-anchor="middle">OH</text><text x="55" y="368" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">5</text><line x1="150" y1="160" x2="150" y2="402" stroke="#1f2430" stroke-width="2"/><text x="150" y="422" font-size="18" font-weight="600" fill="#1f2430" text-anchor="middle">CH₂OH</text><text x="55" y="422" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">6</text><line x1="270" y1="300" x2="380" y2="300" stroke="#334155" stroke-width="2.4" marker-end="url(#ah334155)"/><text x="325" y="285" font-size="13" font-weight="700" fill="#6b7280" text-anchor="middle">C5–OH attacks C1</text><polygon points="480,280 540,230 660,230 720,280 660,330 540,330" fill="#dbeafe" stroke="#1f2430" stroke-width="2.5"/><line x1="540" y1="330" x2="660" y2="330" stroke="#1f2430" stroke-width="7"/><text x="662" y="236" font-size="20" font-weight="800" fill="#b91c1c" text-anchor="middle">O</text><text x="458" y="270" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="middle">C4</text><text x="562" y="220" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="middle">C5</text><text x="742" y="270" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="middle">C1</text><text x="682" y="352" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="middle">C2</text><text x="518" y="352" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="middle">C3</text><line x1="540" y1="230" x2="540" y2="182" stroke="#1f2430" stroke-width="2"/><text x="540" y="176" font-size="16" font-weight="700" fill="#1f2430" text-anchor="middle">CH₂OH (C6)</text><line x1="480" y1="280" x2="480" y2="328" stroke="#1f2430" stroke-width="2"/><text x="480" y="348" font-size="16" font-weight="700" fill="#b91c1c" text-anchor="middle">OH</text><line x1="480" y1="280" x2="480" y2="232" stroke="#1f2430" stroke-width="2"/><text x="480" y="226" font-size="16" font-weight="700" fill="#1f2430" text-anchor="middle">H</text><line x1="540" y1="330" x2="540" y2="282" stroke="#1f2430" stroke-width="2"/><text x="540" y="276" font-size="16" font-weight="700" fill="#b91c1c" text-anchor="middle">OH</text><line x1="660" y1="330" x2="660" y2="378" stroke="#1f2430" stroke-width="2"/><text x="660" y="398" font-size="16" font-weight="700" fill="#b91c1c" text-anchor="middle">OH</text><line x1="720" y1="280" x2="720" y2="232" stroke="#1f2430" stroke-width="2"/><text x="720" y="226" font-size="16" font-weight="700" fill="#15803d" text-anchor="middle">OH</text><text x="600" y="420" font-size="18" font-weight="800" fill="#1d4ed8" text-anchor="middle">β-D-glucopyranose</text><text x="600" y="444" font-size="14" font-weight="500" fill="#6b7280" text-anchor="middle">anomeric OH on C1 points UP, same side as CH₂OH</text><rect x="790" y="110" width="330" height="330" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/><text x="808" y="145" font-size="15" font-weight="700" fill="#1f2430" text-anchor="start">Right in Fischer → DOWN</text><text x="808" y="174" font-size="15" font-weight="700" fill="#1f2430" text-anchor="start">Left in Fischer → UP</text><text x="808" y="203" font-size="15" font-weight="700" fill="#1f2430" text-anchor="start">D-sugar: CH₂OH (C6) points UP</text><text x="808" y="232" font-size="15" font-weight="700" fill="#15803d" text-anchor="start">Anomeric C = old C═O carbon</text><text x="808" y="261" font-size="15" font-weight="500" fill="#6b7280" text-anchor="start">  (C1 in aldoses, C2 in ketoses)</text><text x="808" y="290" font-size="15" font-weight="700" fill="#15803d" text-anchor="start">β = anomeric OH UP (same as CH₂OH)</text><text x="808" y="319" font-size="15" font-weight="700" fill="#15803d" text-anchor="start">α = anomeric OH DOWN (opposite)</text><text x="808" y="348" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="start">Penultimate C = last chiral C</text><text x="808" y="377" font-size="15" font-weight="500" fill="#6b7280" text-anchor="start">  (C5 in hexoses, C4 in ribose)</text><text x="808" y="406" font-size="15" font-weight="500" fill="#1d4ed8" text-anchor="start">  it decides D vs L</text><rect x="40" y="470" width="1080" height="70" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="580" y="512" font-size="16" font-weight="700" fill="#b45309" text-anchor="middle">6-membered ring = pyranose (O + 5 C).  5-membered ring = furanose (O + 4 C).  Always count the ring oxygen.</text></svg>