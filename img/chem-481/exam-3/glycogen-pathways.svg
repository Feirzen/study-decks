<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" width="1160" height="620" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="ah1f2430" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="ahc2410c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ah1d4ed8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ah7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah15803d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ahb91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="ahb45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="ahbe185d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker><marker id="ah0369a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker><marker id="ah334155" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect width="1160" height="620" fill="#ffffff"/><text x="580.0" y="38" text-anchor="middle" font-size="26" font-weight="800" fill="#1f2430">Glycogen synthesis (teal) vs breakdown (coral)</text><text x="580.0" y="64" text-anchor="middle" font-size="15" fill="#6b7280">Two separate one-way routes so they can be regulated separately</text><rect x="470.0" y="97.0" width="180" height="46" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="560" y="126" font-size="16" font-weight="800" fill="#1d4ed8" text-anchor="middle">Glucose-6-P</text><rect x="470.0" y="237.0" width="180" height="46" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="560" y="266" font-size="16" font-weight="800" fill="#1d4ed8" text-anchor="middle">Glucose-1-P</text><rect x="150.0" y="377.0" width="180" height="46" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="240" y="406" font-size="16" font-weight="800" fill="#0f766e" text-anchor="middle">UDP-glucose</text><rect x="450.0" y="517.0" width="220" height="46" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="560" y="546" font-size="16" font-weight="800" fill="#7c3aed" text-anchor="middle">Glycogen (n)</text><rect x="800.0" y="377.0" width="200" height="46" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="900" y="406" font-size="16" font-weight="800" fill="#7c3aed" text-anchor="middle">Glycogen (n−1)</text><rect x="810.0" y="97.0" width="180" height="46" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="900" y="126" font-size="16" font-weight="800" fill="#b45309" text-anchor="middle">Free glucose</text><path d="M 545 145 L 545 236" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#ah334155)"/><path d="M 575 236 L 575 145" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#ah334155)"/><text x="700" y="195" font-size="15" font-weight="800" fill="#334155" text-anchor="middle">phosphoglucomutase</text><text x="700" y="215" font-size="13" font-weight="600" fill="#6b7280" text-anchor="middle">(via glucose-1,6-bisP, Ser–P)</text><path d="M 500 280 Q 330 300 260 376" fill="none" stroke="#0f766e" stroke-width="2.4" marker-end="url(#ah0f766e)"/><text x="300" y="300" font-size="14" font-weight="800" fill="#0f766e" text-anchor="end">UDP-glucose</text><text x="300" y="318" font-size="14" font-weight="800" fill="#0f766e" text-anchor="end">pyrophosphorylase</text><text x="300" y="338" font-size="13" font-weight="600" fill="#6b7280" text-anchor="end">+ UTP → PPi (→ 2 Pi pulls it)</text><path d="M 260 424 Q 300 520 448 535" fill="none" stroke="#0f766e" stroke-width="2.4" marker-end="url(#ah0f766e)"/><text x="250" y="480" font-size="15" font-weight="800" fill="#0f766e" text-anchor="end">glycogen synthase</text><text x="250" y="500" font-size="13" font-weight="600" fill="#6b7280" text-anchor="end">adds α1→4 at nonreducing end</text><text x="250" y="518" font-size="13" font-weight="600" fill="#6b7280" text-anchor="end">UDP leaves (good leaving group)</text><text x="560" y="590" font-size="14" font-weight="700" fill="#7c3aed" text-anchor="middle">branching enzyme makes α1→6 (moves ~7 residues)</text><path d="M 672 530 Q 860 520 900 424" fill="none" stroke="#c2410c" stroke-width="2.4" marker-end="url(#ahc2410c)"/><text x="1010" y="470" font-size="15" font-weight="800" fill="#c2410c" text-anchor="middle">glycogen phosphorylase</text><text x="1010" y="490" font-size="13" font-weight="600" fill="#6b7280" text-anchor="middle">Pi attacks α1→4 (PLP helps)</text><text x="1010" y="508" font-size="13" font-weight="600" fill="#6b7280" text-anchor="middle">stops 4 residues from a branch</text><path d="M 850 378 Q 760 300 650 272" fill="none" stroke="#c2410c" stroke-width="2.4" marker-end="url(#ahc2410c)"/><text x="760" y="300" font-size="14" font-weight="800" fill="#c2410c" text-anchor="middle">G1P out</text><path d="M 960 378 L 960 145" fill="none" stroke="#b45309" stroke-width="2.4" marker-end="url(#ahb45309)" stroke-dasharray="7 6"/><text x="945" y="230" font-size="14" font-weight="800" fill="#b45309" text-anchor="end">debranching enzyme:</text><text x="945" y="248" font-size="13" font-weight="600" fill="#6b7280" text-anchor="end">transfer 3, then hydrolyze α1→6</text><text x="945" y="266" font-size="13" font-weight="600" fill="#6b7280" text-anchor="end">→ 1 FREE glucose per branch</text><path d="M 650 112 L 808 112" fill="none" stroke="#b45309" stroke-width="2.4" marker-end="url(#ahb45309)"/><text x="730" y="100" font-size="14" font-weight="800" fill="#b45309" text-anchor="middle">G6Pase (liver ER)</text><text x="730" y="140" font-size="12" font-weight="600" fill="#b91c1c" text-anchor="middle">muscle lacks it</text></svg>