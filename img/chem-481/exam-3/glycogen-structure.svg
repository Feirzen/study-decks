c" stroke-width="2.2"/><circle cx="350" cy="300" r="11" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.2"/><circle cx="428" cy="228" r="11" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.2"/><circle cx="530" cy="300" r="11" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.2"/><circle cx="582" cy="344" r="11" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.2"/><circle cx="770" cy="300" r="17" fill="none" stroke="#15803d" stroke-width="1.6" stroke-dasharray="3 3"/><circle cx="532" cy="132" r="17" fill="none" stroke="#15803d" stroke-width="1.6" stroke-dasharray="3 3"/><circle cx="668" cy="228" r="17" fill="none" stroke="#15803d" stroke-width="1.6" stroke-dasharray="3 3"/><circle cx="686" cy="432" r="17" fill="none" stroke="#15803d" stroke-width="1.6" stroke-dasharray="3 3"/><circle cx="882" cy="344" r="17" fill="none" stroke="#15803d" stroke-width="1.6" stroke-dasharray="3 3"/><text x="200" y="340" font-size="14" font-weight="800" fill="#b91c1c" text-anchor="middle">reducing end</text><text x="870" y="120" font-size="16" font-weight="800" fill="#15803d" text-anchor="middle">nonreducing ends (dashed rings)</text><text x="870" y="142" font-size="13" font-weight="600" fill="#15803d" text-anchor="middle">synthase ADDS glucose here · phosphorylase REMOVES here</text><text x="330" y="220" font-size="15" font-weight="800" fill="#7c3aed" text-anchor="end">α1→6 branch points</text><text x="330" y="240" font-size="13" font-weight="600" fill="#7c3aed" text-anchor="end">branching enzyme makes them</text><text x="330" y="258" font-size="13" font-weight="600" fill="#7c3aed" text-anchor="end">debranching enzyme cuts them</text><text x="260" y="380" font-size="15" font-weight="800" fill="#1d4ed8" text-anchor="middle">α1→4 chains (blue)</text><rect x="40" y="470" width="1080" height="120" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/><text x="60" y="505" font-size="16" font-weight="700" fill="#1f2430" text-anchor="start">One reducing end (attached to glycogenin) · MANY nonreducing ends · a branch about every 8–12 residues</text><text x="60" y="535" font-size="15" font-weight="500" fill="#1f2430" text-anchor="start">More branches = more ends = faster storage AND faster release, plus a compact, soluble granule.</text><text x="60" y="562" font-size="15" font-weight="500" fill="#1f2430" text-anchor="start">Glycogenin primes the very first chain; glycogen synthase can only extend an existing chain.</text></svg>