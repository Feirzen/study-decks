orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect width="1160" height="610" fill="#ffffff"/><text x="580.0" y="38" text-anchor="middle" font-size="26" font-weight="800" fill="#1f2430">Glycogen: where every enzyme works</text><text x="580.0" y="64" text-anchor="middle" font-size="15" fill="#6b7280">Green = nonreducing ends · red = the single reducing end · purple = α1→6 branch points</text><rect x="50" y="268" width="120" height="64" rx="16" fill="#fef3c7" stroke="#b45309" stroke-width="2.4"/><text x="110" y="296" font-size="15" font-weight="800" fill="#b45309" text-anchor="middle">Glycogenin</text><text x="110" y="316" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">(Tyr–O–)</text><line x1="170" y1="300" x2="200" y2="300" stroke="#1f2430" stroke-width="2"/><polyline points="200,300 230,300 260,300 290,300 320,300 350,300 380,300 410,300 440,300 470,300 500,300 530,300 560,300 590,300 620,300 650,300 680,300 710,300 740,300 770,300" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="350,300 376,276 402,252 428,228 454,204 480,180 506,156 532,132" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="428,228 458,228 488,228 518,228 548,228 578,228 608,228 638,228 668,228" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="530,300 556,322 582,344 608,366 634,388 660,410 686,432" fill="none" stroke="#1f2430" stroke-width="2"/><polyline points="582,344 612,344 642,344 672,344 702,344 732,344 762,344 792,344 822,344 852,344 882,344" fill="none" stroke="#1f2430" stroke-width="2"/><circle cx="200" cy="300" r="11" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.2"/><circle cx="230" cy="300" r="11" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.2"/><circle cx="260" cy="300" r="11" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.2"/><circle cx="290" cy="300" r="11" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.2"/><circle cx="320" cy="300" r="11" fill="#dbeafe" stroke="#