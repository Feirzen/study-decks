orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect width="1000" height="500" fill="#ffffff"/><text x="500.0" y="38" text-anchor="middle" font-size="26" font-weight="800" fill="#1f2430">When you see OAA, think…</text><circle cx="500" cy="285" r="88" fill="#ffedd5" stroke="#c2410c" stroke-width="4"/><text x="500" y="283" font-size="22" font-weight="800" fill="#c2410c" text-anchor="middle">OAA</text><text x="500" y="307" font-size="13" font-weight="600" fill="#6b7280" text-anchor="middle">oxaloacetate, 4 C</text><line x1="500.0" y1="125.0" x2="500.0" y2="193.0" stroke="#DC2626" stroke-width="3.5" marker-end="url(#ah1f2430)"/><rect x="378.6" y="50.0" width="242.8" height="60" rx="14" fill="#fff" stroke="#DC2626" stroke-width="2.2"/><text x="500.0" y="76.0" font-size="17" font-weight="800" fill="#DC2626" text-anchor="middle">from pyruvate</text><text x="500.0" y="97.0" font-size="12.5" font-weight="600" fill="#6b7280" text-anchor="middle">pyruvate carboxylase (biotin)</text><circle cx="617.4" cy="52.0" r="13" fill="#DC2626"/><text x="617.4" y="57.0" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">5</text><line x1="586.4517211123036" y1="253.53414681403848" x2="739.6216183004067" y2="230.27677706789302" stroke="#DC2626" stroke-width="3.5" marker-end="url(#ah1f2430)"/><rect x="710.2985648593499" y="184.8858706182379" width="199.6" height="60" rx="14" fill="#fff" stroke="#DC2626" stroke-width="2.2"/><text x="810.0985648593498" y="210.8858706182379" font-size="17" font-weight="800" fill="#DC2626" text-anchor="middle">→ PEP</text><text x="810.0985648593498" y="231.8858706182379" font-size="12.5" font-weight="600" fill="#6b7280" text-anchor="middle">PEPCK (GTP, CO₂ leaves)</text><circle cx="905.8985648593498" cy="186.8858706182379" r="13" fill="#DC2626"/><text x="905.8985648593498" y="191.8858706182379" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">5</text><line x1="575.3619880745872" y1="337.76903214429626" x2="708.8837712936929" y2="376.7722298161674" stroke="#9333EA" stroke-width="3.5" marker-end="url(#ah1f2430)"/><rect x="637.8201746153673" y="372.5831694519644" width="265.0" height="60" rx="14" fill="#fff" stroke="#9333EA" stroke-width="2.2"/><text x="770.3201746153673" y="398.5831694519644" font-size="17" font-weight="800" fill="#9333EA" text-anchor="middle">+ Acetyl-CoA → Citrate</text><text x="770.3201746153673" y="419.5831694519644" font-size="12.5" font-weight="600" fill="#6b7280" text-anchor="middle">citrate synthase</text><circle cx="898.8201746153673" cy="374.5831694519644" r="13" fill="#9333EA"/><text x="898.8201746153673" y="379.5831694519644" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">2</text><line x1="420.3256628518316" y1="331.0" x2="279.16352203496814" y2="365.0" stroke="#9333EA" stroke-width="3.5" marker-end="url(#ah1f2430)" marker-start="url(#ah1f2430)"/><rect x="114.41161675113524" y="357.5" width="199.6" height="60" rx="14" fill="#fff" stroke="#9333EA" stroke-width="2.2"/><text x="214.21161675113524" y="383.5" font-size="17" font-weight="800" fill="#9333EA" text-anchor="middle">⇄ Malate</text><text x="214.21161675113524" y="404.5" font-size="12.5" font-weight="600" fill="#6b7280" text-anchor="middle">MDH, to cross membranes</text><circle cx="310.01161675113525" cy="359.5" r="13" fill="#9333EA"/><text x="310.01161675113525" y="364.5" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">2</text><line x1="279.1635220349682" y1="205.0" x2="420.3256628518317" y2="239.0" stroke="#9333EA" stroke-width="3.5" marker-end="url(#ah1f2430)"/><rect x="102.71161675113524" y="152.49999999999997" width="223.0" height="60" rx="14" fill="#fff" stroke="#9333EA" stroke-width="2.2"/><text x="214.21161675113524" y="178.49999999999997" font-size="17" font-weight="800" fill="#9333EA" text-anchor="middle">from citrate lyase</text><text x="214.21161675113524" y="199.49999999999997" font-size="12.5" font-weight="600" fill="#6b7280" text-anchor="middle">cytosol, after the shuttle</text><circle cx="321.71161675113524" cy="154.49999999999997" r="13" fill="#9333EA"/><text x="321.71161675113524" y="159.49999999999997" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="500" y="488" font-size="13" font-weight="600" fill="#6b7280" text-anchor="middle">Numbered circle = chapter · ★ = next exam (TCA cycle)</text></svg>