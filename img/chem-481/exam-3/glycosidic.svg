orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect width="1000" height="615" fill="#ffffff"/><text x="500.0" y="38" text-anchor="middle" font-size="26" font-weight="800" fill="#1f2430">Glycosidic bonds and reducing vs nonreducing</text><text x="500.0" y="64" text-anchor="middle" font-size="15" fill="#6b7280">A sugar is reducing if ANY anomeric carbon is still free</text><text x="60" y="136" font-size="18" font-weight="800" fill="#1f2430" text-anchor="start">Maltose</text><text x="60" y="158" font-size="14" font-weight="600" fill="#6b7280" text-anchor="start">Glc(α1→4)Glc</text><polygon points="274,130 297,100 343,100 366,130 343,160 297,160" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.4"/><text x="320" y="136" font-size="15" font-weight="800" fill="#1d4ed8" text-anchor="middle">Glc</text><line x1="366" y1="130" x2="434" y2="130" stroke="#1f2430" stroke-width="3"/><text x="400" y="120" font-size="13" font-weight="800" fill="#7c3aed" text-anchor="middle">α1→4</text><polygon points="434,130 457,100 503,100 526,130 503,160 457,160" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.4"/><text x="480" y="136" font-size="15" font-weight="800" fill="#1d4ed8" text-anchor="middle">Glc</text><circle cx="526" cy="130" r="8" fill="#15803d"/><rect x="550.0" y="115.0" width="420" height="30" rx="15.0" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="760" y="135.04" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">REDUCING: right glucose C1 is free</text><text x="60" y="241" font-size="18" font-weight="800" fill="#1f2430" text-anchor="start">Lactose</text><text x="60" y="263" font-size="14" font-weight="600" fill="#6b7280" text-anchor="start">Gal(β1→4)Glc</text><polygon points="274,235 297,205 343,205 366,235 343,265 297,265" fill="#fce7f3" stroke="#be185d" stroke-width="2.4"/><text x="320" y="241" font-size="15" font-weight="800" fill="#be185d" text-anchor="middle">Gal</text><line x1="366" y1="235" x2="434" y2="235" stroke="#1f2430" stroke-width="3"/><text x="400" y="225" font-size="13" font-weight="800" fill="#7c3aed" text-anchor="middle">β1→4</text><polygon points="434,235 457,205 503,205 526,235 503,265 457,265" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.4"/><text x="480" y="241" font-size="15" font-weight="800" fill="#1d4ed8" text-anchor="middle">Glc</text><circle cx="526" cy="235" r="8" fill="#15803d"/><rect x="550.0" y="220.0" width="420" height="30" rx="15.0" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="760" y="240.04" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">REDUCING: glucose C1 is free</text><text x="60" y="346" font-size="18" font-weight="800" fill="#1f2430" text-anchor="start">Sucrose</text><text x="60" y="368" font-size="14" font-weight="600" fill="#6b7280" text-anchor="start">Glc(α1↔2β)Fru</text><polygon points="274,340 297,310 343,310 366,340 343,370 297,370" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.4"/><text x="320" y="346" font-size="15" font-weight="800" fill="#1d4ed8" text-anchor="middle">Glc</text><line x1="366" y1="340" x2="434" y2="340" stroke="#1f2430" stroke-width="3"/><text x="400" y="330" font-size="13" font-weight="800" fill="#7c3aed" text-anchor="middle">α1↔2β</text><polygon points="434,340 457,310 503,310 526,340 503,370 457,370" fill="#fef3c7" stroke="#b45309" stroke-width="2.4"/><text x="480" y="346" font-size="15" font-weight="800" fill="#b45309" text-anchor="middle">Fru</text><rect x="550.0" y="325.0" width="420" height="30" rx="15.0" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/><text x="760" y="345.04" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="middle">NONREDUCING: both anomeric C's locked</text><text x="60" y="451" font-size="18" font-weight="800" fill="#1f2430" text-anchor="start">Trehalose</text><text x="60" y="473" font-size="14" font-weight="600" fill="#6b7280" text-anchor="start">Glc(α1↔1α)Glc</text><polygon points="274,445 297,415 343,415 366,445 343,475 297,475" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.4"/><text x="320" y="451" font-size="15" font-weight="800" fill="#1d4ed8" text-anchor="middle">Glc</text><line x1="366" y1="445" x2="434" y2="445" stroke="#1f2430" stroke-width="3"/><text x="400" y="435" font-size="13" font-weight="800" fill="#7c3aed" text-anchor="middle">α1↔1α</text><polygon points="434,445 457,415 503,415 526,445 503,475 457,475" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.4"/><text x="480" y="451" font-size="15" font-weight="800" fill="#1d4ed8" text-anchor="middle">Glc</text><rect x="550.0" y="430.0" width="420" height="30" rx="15.0" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/><text x="760" y="450.04" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="middle">NONREDUCING: both anomeric C's locked</text><circle cx="80" cy="555" r="8" fill="#15803d"/><text x="98" y="560" font-size="15" font-weight="600" fill="#1f2430" text-anchor="start">= free anomeric carbon: ring can open → aldehyde can be oxidized → reducing sugar, can flip α ⇄ β</text><text x="60" y="590" font-size="15" font-weight="600" fill="#1f2430" text-anchor="start">Naming: first sugar's anomeric config + carbon → carbon on the next sugar. Glycogen chain = α1→4, branch = α1→6.</text></svg>