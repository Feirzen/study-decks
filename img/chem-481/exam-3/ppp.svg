<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 585" width="1160" height="585" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="ah1f2430" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="ahc2410c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ah1d4ed8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ah7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah15803d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ahb91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="ahb45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="ahbe185d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker><marker id="ah0369a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker><marker id="ah334155" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect width="1160" height="585" fill="#ffffff"/><text x="580.0" y="38" text-anchor="middle" font-size="26" font-weight="800" fill="#1f2430">Pentose phosphate pathway</text><text x="580.0" y="64" text-anchor="middle" font-size="15" fill="#6b7280">Purpose: NADPH (for fat synthesis, antioxidants) and/or ribose-5-P (for nucleotides)</text><rect x="40" y="90" width="520" height="470" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="300" y="125" font-size="19" font-weight="800" fill="#0f766e" text-anchor="middle">OXIDATIVE phase  (irreversible)</text><rect x="150" y="153" width="300" height="42" rx="11" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="300" y="180" font-size="15" font-weight="800" fill="#1f2430" text-anchor="middle">Glucose-6-P</text><rect x="150" y="253" width="300" height="42" rx="11" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="300" y="280" font-size="15" font-weight="800" fill="#1f2430" text-anchor="middle">6-phosphoglucono-δ-lactone</text><rect x="150" y="353" width="300" height="42" rx="11" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="300" y="380" font-size="15" font-weight="800" fill="#1f2430" text-anchor="middle">6-phosphogluconate</text><rect x="150" y="468" width="300" height="42" rx="11" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="300" y="495" font-size="15" font-weight="800" fill="#1f2430" text-anchor="middle">Ribulose-5-P</text><line x1="300" y1="198" x2="300" y2="252" stroke="#0f766e" stroke-width="2.4" marker-end="url(#ah0f766e)"/><rect x="447.84000000000003" y="210.0" width="84.32" height="30" rx="15.0" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/><text x="490" y="229.68" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">NADPH #1</text><text x="312" y="230" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start">G6P dehydrogenase</text><line x1="300" y1="298" x2="300" y2="352" stroke="#0f766e" stroke-width="2.4" marker-end="url(#ah0f766e)"/><text x="312" y="330" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start">lactonase (H₂O)</text><line x1="300" y1="398" x2="300" y2="467" stroke="#0f766e" stroke-width="2.4" marker-end="url(#ah0f766e)"/><rect x="462.84000000000003" y="395.0" width="84.32" height="30" rx="15.0" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/><text x="505" y="414.68" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">NADPH #2</text><rect x="443.99" y="433.0" width="122.02" height="30" rx="15.0" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/><text x="505" y="452.68" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">CO₂ (from C1)</text><text x="312" y="435" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start">6PG dehydrogenase</text><text x="300" y="545" font-size="14" font-weight="800" fill="#b91c1c" text-anchor="middle">Makes CO₂ → can't run backward</text><rect x="600" y="90" width="520" height="470" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="860" y="125" font-size="19" font-weight="800" fill="#7c3aed" text-anchor="middle">NONOXIDATIVE phase  (reversible)</text><text x="860" y="165" font-size="13" font-weight="700" fill="#6b7280" text-anchor="middle">transketolase (moves 2 C, TPP)  ·  transaldolase (moves 3 C)</text><text x="860" y="215" font-size="18" font-weight="800" fill="#1f2430" text-anchor="middle">3 pentose-P  (3 × 5 = 15 C)</text><line x1="860" y1="230" x2="860" y2="285" stroke="#7c3aed" stroke-width="3" marker-end="url(#ah7c3aed)" marker-start="url(#ah7c3aed)"/><text x="860" y="315" font-size="18" font-weight="800" fill="#1f2430" text-anchor="middle">2 F6P + 1 GAP  (12 + 3 = 15 C)</text><text x="860" y="350" font-size="14" font-weight="700" fill="#7c3aed" text-anchor="middle">no NADPH, no CO₂: just reshuffling carbons</text><rect x="625" y="380" width="470" height="40" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.6"/><text x="640" y="405" font-size="14" font-weight="800" fill="#1f2430" text-anchor="start">Need NADPH + ribose</text><text x="1080" y="405" font-size="13" font-weight="700" fill="#0f766e" text-anchor="end">oxidative only</text><rect x="625" y="430" width="470" height="40" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.6"/><text x="640" y="455" font-size="14" font-weight="800" fill="#1f2430" text-anchor="start">Need NADPH, not ribose</text><text x="1080" y="455" font-size="13" font-weight="700" fill="#0f766e" text-anchor="end">oxidative → nonox. back to F6P/GAP</text><rect x="625" y="480" width="470" height="40" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.6"/><text x="640" y="505" font-size="14" font-weight="800" fill="#1f2430" text-anchor="start">Need ribose, not NADPH</text><text x="1080" y="505" font-size="13" font-weight="700" fill="#7c3aed" text-anchor="end">nonox. run backward from F6P/GAP</text></svg>