<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 850" width="1160" height="850" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="ah1f2430" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="ahc2410c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ah1d4ed8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ah7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah15803d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ahb91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="ahb45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="ahbe185d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker><marker id="ah0369a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker><marker id="ah334155" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect width="1160" height="850" fill="#ffffff"/><text x="580.0" y="38" text-anchor="middle" font-size="26" font-weight="800" fill="#1f2430">Feeder pathways: how other sugars get into glycolysis</text><text x="580.0" y="64" text-anchor="middle" font-size="15" fill="#6b7280">Fructose (liver) skips PFK-1 · mannose acts like glucose · galactose needs UDP to flip C4</text><rect x="485.0" y="90.0" width="150" height="40" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/><text x="560" y="116" font-size="15" font-weight="800" fill="#334155" text-anchor="middle">Glucose</text><rect x="485.0" y="170.0" width="150" height="40" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/><text x="560" y="196" font-size="15" font-weight="800" fill="#334155" text-anchor="middle">G6P</text><rect x="485.0" y="250.0" width="150" height="40" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/><text x="560" y="276" font-size="15" font-weight="800" fill="#334155" text-anchor="middle">F6P</text><rect x="485.0" y="350.0" width="150" height="40" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/><text x="560" y="376" font-size="15" font-weight="800" fill="#334155" text-anchor="middle">F1,6BP</text><rect x="460.0" y="450.0" width="200" height="40" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/><text x="560" y="476" font-size="15" font-weight="800" fill="#334155" text-anchor="middle">DHAP  ⇄  GAP</text><rect x="485.0" y="530.0" width="150" height="40" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/><text x="560" y="556" font-size="15" font-weight="800" fill="#334155" text-anchor="middle">→ pyruvate</text><line x1="560" y1="131" x2="560" y2="168" stroke="#1f2430" stroke-width="2.4" marker-end="url(#ah1f2430)"/><line x1="560" y1="211" x2="560" y2="248" stroke="#1f2430" stroke-width="2.4" marker-end="url(#ah1f2430)"/><line x1="560" y1="291" x2="560" y2="348" stroke="#1f2430" stroke-width="2.4" marker-end="url(#ah1f2430)"/><line x1="560" y1="391" x2="560" y2="448" stroke="#1f2430" stroke-width="2.4" marker-end="url(#ah1f2430)"/><line x1="560" y1="491" x2="560" y2="528" stroke="#1f2430" stroke-width="2.4" marker-end="url(#ah1f2430)"/><text x="572" y="156" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start">hexokinase</text><rect x="345" y="303" width="140" height="34" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="415" y="325" font-size="13" font-weight="800" fill="#b91c1c" text-anchor="middle">PFK-1 (control)</text><path d="M 485 320 L 552 320" fill="none" stroke="#b91c1c" stroke-width="2.4" marker-end="url(#ahb91c1c)"/><rect x="55.0" y="127.0" width="190" height="46" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="150" y="156" font-size="16" font-weight="800" fill="#b45309" text-anchor="middle">Fructose (liver)</text><rect x="65.0" y="237.0" width="170" height="46" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="150" y="266" font-size="16" font-weight="800" fill="#b45309" text-anchor="middle">Fructose-1-P</text><rect x="35.0" y="357.0" width="230" height="46" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="150" y="386" font-size="16" font-weight="800" fill="#b45309" text-anchor="middle">DHAP + glyceraldehyde</text><line x1="150" y1="172" x2="150" y2="237" stroke="#b45309" stroke-width="2.4" marker-end="url(#ahb45309)"/><text x="160" y="210" font-size="13" font-weight="700" fill="#b45309" text-anchor="start">fructokinase (ATP)</text><line x1="150" y1="282" x2="150" y2="357" stroke="#b45309" stroke-width="2.4" marker-end="url(#ahb45309)"/><text x="160" y="322" font-size="13" font-weight="700" fill="#b45309" text-anchor="start">F1P aldolase (aldolase B)</text><path d="M 266 390 Q 380 470 458 470" fill="none" stroke="#b45309" stroke-width="2.4" marker-end="url(#ahb45309)"/><text x="330" y="455" font-size="13" font-weight="800" fill="#b45309" text-anchor="end">triose kinase:</text><text x="330" y="473" font-size="13" font-weight="700" fill="#b45309" text-anchor="end">glyceraldehyde → GAP</text><text x="60" y="520" font-size="14" font-weight="800" fill="#b91c1c" text-anchor="start">Liver fructose enters BELOW PFK-1,</text><text x="60" y="540" font-size="14" font-weight="800" fill="#b91c1c" text-anchor="start">so it skips glycolysis's main brake</text><rect x="795.0" y="127.0" width="250" height="46" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="920" y="156" font-size="16" font-weight="800" fill="#b45309" text-anchor="middle">Fructose (muscle/adipose)</text><path d="M 795 160 L 637 262" fill="none" stroke="#b45309" stroke-width="2.4" marker-end="url(#ahb45309)"/><text x="760" y="230" font-size="13" font-weight="700" fill="#b45309" text-anchor="start">hexokinase → F6P</text><rect x="845.0" y="277.0" width="150" height="46" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="920" y="306" font-size="16" font-weight="800" fill="#15803d" text-anchor="middle">Mannose</text><rect x="835.0" y="367.0" width="170" height="46" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="920" y="396" font-size="16" font-weight="800" fill="#15803d" text-anchor="middle">Mannose-6-P</text><line x1="920" y1="322" x2="920" y2="367" stroke="#15803d" stroke-width="2.4" marker-end="url(#ah15803d)"/><text x="930" y="350" font-size="13" font-weight="700" fill="#15803d" text-anchor="start">hexokinase</text><path d="M 835 388 Q 720 360 637 282" fill="none" stroke="#15803d" stroke-width="2.4" marker-end="url(#ah15803d)"/><text x="830" y="430" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">phosphomannose isomerase → F6P</text><rect x="45.0" y="617.0" width="150" height="46" rx="12" fill="#fce7f3" stroke="#be185d" stroke-width="2"/><text x="120" y="646" font-size="16" font-weight="800" fill="#be185d" text-anchor="middle">Galactose</text><rect x="285.0" y="617.0" width="170" height="46" rx="12" fill="#fce7f3" stroke="#be185d" stroke-width="2"/><text x="370" y="646" font-size="16" font-weight="800" fill="#be185d" text-anchor="middle">Galactose-1-P</text><rect x="750.0" y="617.0" width="220" height="46" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="860" y="646" font-size="16" font-weight="800" fill="#1d4ed8" text-anchor="middle">Glucose-1-P → G6P</text><line x1="196" y1="640" x2="284" y2="640" stroke="#be185d" stroke-width="2.4" marker-end="url(#ahbe185d)"/><text x="240" y="626" font-size="12" font-weight="800" fill="#be185d" text-anchor="middle">galactokinase</text><text x="240" y="664" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle">(ATP)</text><line x1="456" y1="640" x2="748" y2="640" stroke="#be185d" stroke-width="2.4" marker-end="url(#ahbe185d)"/><text x="600" y="626" font-size="14" font-weight="800" fill="#be185d" text-anchor="middle">uridylyltransferase</text><rect x="390.0" y="737.0" width="160" height="46" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="470" y="766" font-size="16" font-weight="800" fill="#0f766e" text-anchor="middle">UDP-glucose</text><rect x="645.0" y="737.0" width="170" height="46" rx="12" fill="#fce7f3" stroke="#be185d" stroke-width="2"/><text x="730" y="766" font-size="16" font-weight="800" fill="#be185d" text-anchor="middle">UDP-galactose</text><path d="M 470 737 Q 520 660 570 645" fill="none" stroke="#0f766e" stroke-width="2.4" marker-end="url(#ah0f766e)"/><path d="M 630 645 Q 690 660 720 737" fill="none" stroke="#be185d" stroke-width="2.4" marker-end="url(#ahbe185d)"/><line x1="643" y1="768" x2="552" y2="768" stroke="#be185d" stroke-width="2.4" marker-end="url(#ahbe185d)"/><text x="598" y="800" font-size="13" font-weight="800" fill="#be185d" text-anchor="middle">epimerase flips C4</text><text x="470" y="820" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">UDP-glucose is recycled (no net UTP cost)</text><path d="M 860 617 Q 860 400 637 198" fill="none" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#ah1d4ed8)" stroke-dasharray="7 6"/><text x="1040" y="600" font-size="13" font-weight="800" fill="#1d4ed8" text-anchor="middle">phosphoglucomutase</text><text x="1040" y="618" font-size="13" font-weight="600" fill="#6b7280" text-anchor="middle">G1P → G6P</text></svg>