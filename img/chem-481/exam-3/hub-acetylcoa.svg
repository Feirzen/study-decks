orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect width="1000" height="500" fill="#ffffff"/><text x="500.0" y="38" text-anchor="middle" font-size="26" font-weight="800" fill="#1f2430">When you see Acetyl-CoA, think…</text><circle cx="500" cy="285" r="88" fill="#ede9fe" stroke="#7c3aed" stroke-width="4"/><text x="500" y="283" font-size="22" font-weight="800" fill="#7c3aed" text-anchor="middle">Acetyl-CoA</text><text x="500" y="307" font-size="13" font-weight="600" fill="#6b7280" text-anchor="middle">2 carbons on CoA</text><line x1="500.0" y1="125.0" x2="500.0" y2="193.0" stroke="#EA580C" stroke-width="3.5" marker-end="url(#ah1f2430)"/><rect x="393.0" y="50.0" width="214.0" height="60" rx="14" fill="#fff" stroke="#EA580C" stroke-width="2.2"/><text x="500.0" y="76.0" font-size="17" font-weight="800" fill="#EA580C" text-anchor="middle">from β-oxidation</text><text x="500.0" y="97.0" font-size="12.5" font-weight="600" fill="#6b7280" text-anchor="middle">fat chopped 2 C at a time</text><circle cx="603.0" cy="52.0" r="13" fill="#EA580C"/><text x="603.0" y="57.0" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">1</text><line x1="731.1084856943457" y1="217.3810781214881" x2="583.3803164073718" y2="246.11911991985565" stroke="#475569" stroke-width="3.5" marker-end="url(#ah1f2430)"/><rect x="706.4815697220944" y="168.36325634315662" width="185.20000000000002" height="60" rx="14" fill="#fff" stroke="#475569" stroke-width="2.2"/><text x="799.0815697220944" y="194.36325634315662" font-size="17" font-weight="800" fill="#475569" text-anchor="middle">from pyruvate</text><text x="799.0815697220944" y="215.36325634315662" font-size="12.5" font-weight="600" fill="#6b7280" text-anchor="middle">PDH (sugar's carbons)</text><circle cx="887.6815697220944" cy="170.36325634315662" r="13" fill="#475569"/><text x="887.6815697220944" y="175.36325634315662" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">★</text><line x1="579.6743371481683" y1="331.0" x2="720.8364779650319" y2="365.0" stroke="#475569" stroke-width="3.5" marker-end="url(#ah1f2430)"/><rect x="685.9883832488648" y="357.5" width="199.6" height="60" rx="14" fill="#fff" stroke="#475569" stroke-width="2.2"/><text x="785.7883832488648" y="383.5" font-size="17" font-weight="800" fill="#475569" text-anchor="middle">→ Burn for ATP</text><text x="785.7883832488648" y="404.5" font-size="12.5" font-weight="600" fill="#6b7280" text-anchor="middle">TCA cycle in the matrix</text><circle cx="881.5883832488647" cy="359.5" r="13" fill="#475569"/><text x="881.5883832488647" y="364.5" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">★</text><line x1="420.3256628518316" y1="331.0" x2="279.16352203496814" y2="365.0" stroke="#9333EA" stroke-width="3.5" marker-end="url(#ah1f2430)"/><rect x="85.61161675113522" y="357.5" width="257.20000000000005" height="60" rx="14" fill="#fff" stroke="#9333EA" stroke-width="2.2"/><text x="214.21161675113524" y="383.5" font-size="17" font-weight="800" fill="#9333EA" text-anchor="middle">→ Citrate → fat</text><text x="214.21161675113524" y="404.5" font-size="12.5" font-weight="600" fill="#6b7280" text-anchor="middle">citrate shuttle, then ACC + FAS</text><circle cx="338.81161675113526" cy="359.5" r="13" fill="#9333EA"/><text x="338.81161675113526" y="364.5" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">2</text><line x1="420.3256628518317" y1="239.0" x2="279.1635220349682" y2="205.0" stroke="#2563EB" stroke-width="3.5" marker-end="url(#ah1f2430)"/><rect x="89.21161675113524" y="152.49999999999997" width="250.0" height="60" rx="14" fill="#fff" stroke="#2563EB" stroke-width="2.2"/><text x="214.21161675113524" y="178.49999999999997" font-size="17" font-weight="800" fill="#2563EB" text-anchor="middle">Signal when high</text><text x="214.21161675113524" y="199.49999999999997" font-size="12.5" font-weight="600" fill="#6b7280" text-anchor="middle">PC on, PDH off (fasting liver)</text><circle cx="335.21161675113524" cy="154.49999999999997" r="13" fill="#2563EB"/><text x="335.21161675113524" y="159.49999999999997" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">6</text><text x="500" y="488" font-size="13" font-weight="600" fill="#6b7280" text-anchor="middle">Numbered circle = chapter · ★ = next exam (TCA cycle)</text></svg>