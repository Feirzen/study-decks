<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 610" width="1160" height="610" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="ah1f2430" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="ahc2410c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ah1d4ed8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ah7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah15803d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ahb91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="ahb45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="ahbe185d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker><marker id="ah0369a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker><marker id="ah334155" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect width="1160" height="610" fill="#ffffff"/><text x="580.0" y="38" text-anchor="middle" font-size="26" font-weight="800" fill="#1f2430">One biotin mechanism, three enzymes</text><text x="580.0" y="64" text-anchor="middle" font-size="15" fill="#6b7280">Same two half-reactions: activate CO₂ with ATP, then hand it to the α-carbon</text><rect x="40" y="90" width="520" height="300" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="300" y="125" font-size="18" font-weight="800" fill="#b45309" text-anchor="middle">Half-reaction 1: biotin carboxylase site</text><text x="300" y="170" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">HCO₃⁻ + ATP → carboxyphosphate + ADP</text><text x="300" y="196" font-size="15" font-weight="500" fill="#6b7280" text-anchor="middle">(ATP makes the poor electrophile reactive)</text><text x="300" y="222" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle"></text><text x="300" y="248" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">carboxyphosphate + biotin–N → carboxybiotin + Pi</text><text x="300" y="274" font-size="15" font-weight="500" fill="#6b7280" text-anchor="middle">(biotin's N grabs the CO₂)</text><text x="300" y="300" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle"></text><text x="300" y="326" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">Biotin rides on a long lysine arm</text><text x="300" y="352" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">that SWINGS to site 2</text><rect x="600" y="90" width="520" height="300" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="860" y="125" font-size="18" font-weight="800" fill="#1d4ed8" text-anchor="middle">Half-reaction 2: transcarboxylase site</text><text x="860" y="170" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">substrate's α-carbon loses H⁺ → enolate</text><text x="860" y="196" font-size="15" font-weight="500" fill="#6b7280" text-anchor="middle">(next to a C═O, so the H is acidic)</text><text x="860" y="222" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle"></text><text x="860" y="248" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">enolate attacks CO₂ on carboxybiotin</text><text x="860" y="274" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">→ carboxylated product</text><text x="860" y="300" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle"></text><text x="860" y="326" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">THIS site decides substrate specificity</text><text x="860" y="352" font-size="15" font-weight="500" fill="#6b7280" text-anchor="middle">(which molecule gets the CO₂)</text><rect x="40" y="416" width="1080" height="46" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="60" y="446" font-size="16" font-weight="800" fill="#7c3aed" text-anchor="start">Acetyl-CoA carboxylase (ACC)</text><text x="560" y="446" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">acetyl-CoA → malonyl-CoA</text><text x="1100" y="446" font-size="14" font-weight="600" fill="#6b7280" text-anchor="end">fatty acid synthesis (cytosol)</text><rect x="40" y="472" width="1080" height="46" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="1.8"/><text x="60" y="502" font-size="16" font-weight="800" fill="#c2410c" text-anchor="start">Pyruvate carboxylase</text><text x="560" y="502" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">pyruvate → oxaloacetate</text><text x="1100" y="502" font-size="14" font-weight="600" fill="#6b7280" text-anchor="end">gluconeogenesis / refill TCA (matrix)</text><rect x="40" y="528" width="1080" height="46" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/><text x="60" y="558" font-size="16" font-weight="800" fill="#0f766e" text-anchor="start">Propionyl-CoA carboxylase</text><text x="560" y="558" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">propionyl-CoA → D-methylmalonyl-CoA</text><text x="1100" y="558" font-size="14" font-weight="600" fill="#6b7280" text-anchor="end">odd-chain fat breakdown</text></svg>