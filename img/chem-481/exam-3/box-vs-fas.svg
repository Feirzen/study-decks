<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 560" width="1170" height="560" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="ah1f2430" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="ahc2410c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ah1d4ed8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ah7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah15803d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ahb91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="ahb45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="ahbe185d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker><marker id="ah0369a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker><marker id="ah334155" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect width="1170" height="560" fill="#ffffff"/><text x="585.0" y="38" text-anchor="middle" font-size="26" font-weight="800" fill="#1f2430">Same chemistry, opposite direction, kept apart</text><text x="585.0" y="64" text-anchor="middle" font-size="15" fill="#6b7280">Different place, carrier, cofactor and 2-C unit = no futile cycle</text><rect x="260" y="90" width="430" height="46" rx="10" fill="#c2410c"/><text x="475.0" y="120" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">β-Oxidation (breakdown)</text><rect x="700" y="90" width="430" height="46" rx="10" fill="#0f766e"/><text x="915.0" y="120" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">Fatty acid synthesis</text><rect x="40" y="150" width="1090" height="48" rx="10" fill="#f1f5f9"/><text x="58" y="180" font-size="15" font-weight="800" fill="#1f2430" text-anchor="start">Where</text><text x="475" y="180" font-size="15" font-weight="600" fill="#c2410c" text-anchor="middle">mitochondrial matrix</text><text x="915" y="180" font-size="15" font-weight="600" fill="#0f766e" text-anchor="middle">cytosol</text><rect x="40" y="206" width="1090" height="48" rx="10" fill="#fff"/><text x="58" y="236" font-size="15" font-weight="800" fill="#1f2430" text-anchor="start">Acyl carrier</text><text x="475" y="236" font-size="15" font-weight="600" fill="#c2410c" text-anchor="middle">CoA</text><text x="915" y="236" font-size="15" font-weight="600" fill="#0f766e" text-anchor="middle">ACP (acyl carrier protein)</text><rect x="40" y="262" width="1090" height="48" rx="10" fill="#f1f5f9"/><text x="58" y="292" font-size="15" font-weight="800" fill="#1f2430" text-anchor="start">Electron carriers</text><text x="475" y="292" font-size="15" font-weight="600" fill="#c2410c" text-anchor="middle">FAD and NAD⁺ (accept e⁻)</text><text x="915" y="292" font-size="15" font-weight="600" fill="#0f766e" text-anchor="middle">NADPH (donates e⁻)</text><rect x="40" y="318" width="1090" height="48" rx="10" fill="#fff"/><text x="58" y="348" font-size="15" font-weight="800" fill="#1f2430" text-anchor="start">2-carbon unit</text><text x="475" y="348" font-size="15" font-weight="600" fill="#c2410c" text-anchor="middle">acetyl-CoA released</text><text x="915" y="348" font-size="15" font-weight="600" fill="#0f766e" text-anchor="middle">malonyl-CoA added (CO₂ lost)</text><rect x="40" y="374" width="1090" height="48" rx="10" fill="#f1f5f9"/><text x="58" y="404" font-size="15" font-weight="800" fill="#1f2430" text-anchor="start">Step order</text><text x="475" y="404" font-size="15" font-weight="600" fill="#c2410c" text-anchor="middle">oxidize → hydrate → oxidize → thiolysis</text><text x="915" y="404" font-size="15" font-weight="600" fill="#0f766e" text-anchor="middle">condense → reduce → dehydrate → reduce</text><rect x="40" y="430" width="1090" height="48" rx="10" fill="#fff"/><text x="58" y="460" font-size="15" font-weight="800" fill="#1f2430" text-anchor="start">Control point</text><text x="475" y="460" font-size="15" font-weight="600" fill="#c2410c" text-anchor="middle">CPT1 (carnitine shuttle)</text><text x="915" y="460" font-size="15" font-weight="600" fill="#0f766e" text-anchor="middle">ACC (makes malonyl-CoA)</text><rect x="40" y="486" width="1090" height="48" rx="10" fill="#f1f5f9"/><text x="58" y="516" font-size="15" font-weight="800" fill="#1f2430" text-anchor="start">Hormone</text><text x="475" y="516" font-size="15" font-weight="600" fill="#c2410c" text-anchor="middle">glucagon / fasting</text><text x="915" y="516" font-size="15" font-weight="600" fill="#0f766e" text-anchor="middle">insulin / fed</text></svg>